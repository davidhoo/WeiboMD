<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 260px;
      padding: 16px;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #fff;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #ff8200, #ff6a00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .version {
      font-size: 11px;
      color: #aaa;
    }
    .desc {
      font-size: 13px;
      color: #666;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #f8f8fa;
      border-radius: 8px;
    }
    .toggle-label {
      font-size: 13px;
      font-weight: 500;
      color: #333;
    }
    .switch {
      position: relative;
      width: 42px;
      height: 24px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      background: #ccc;
      border-radius: 24px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.3s;
    }
    .switch input:checked + .slider {
      background: #ff8200;
    }
    .switch input:checked + .slider::before {
      transform: translateX(18px);
    }
    .footer {
      margin-top: 14px;
      font-size: 11px;
      color: #bbb;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="logo">WeiboMD</span>
    <span class="version">v1.0.0</span>
  </div>
  <div class="desc">自动识别并渲染微博内容中的 Markdown 格式文本。</div>
  <div class="toggle-row">
    <span class="toggle-label">启用渲染</span>
    <label class="switch">
      <input type="checkbox" id="toggle" checked>
      <span class="slider"></span>
    </label>
  </div>
  <div class="footer">点击微博中的 MD 按钮可单独切换</div>
  <script src="popup.js"></script>
</body>
</html>
